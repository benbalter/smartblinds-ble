[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: "smartblinds-ble" is a working name. Pick a final, non-trademark-implying
# name before publishing to PyPI (do not imply MySmartBlinds/Tilt affiliation).
name = "smartblinds-ble"
version = "0.0.1"
description = "Local, hub-free async BLE control of MySmartBlinds/Tilt shade motors"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ben Balter" }]
keywords = ["ble", "bluetooth", "blinds", "home-assistant", "mysmartblinds", "tilt"]
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
smartblinds-find-key = "smartblinds_ble.tools.find_key:main"

[project.urls]
Homepage = "https://github.com/benbalter/smartblinds-ble"
Issues = "https://github.com/benbalter/smartblinds-ble/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smartblinds_ble"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
